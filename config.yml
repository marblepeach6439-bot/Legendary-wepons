# Optional: URL of the hosted resource pack zip (sent to players on join). Leave empty to disable.
resource-pack-url: ""
# SHA-1 of MarblesOpAhWeapons-ResourcePack.zip (makes players always download the newest pack)
resource-pack-sha1: "35b12366e4400a71312479e95c7bf7e38207b0b4"
resource-pack-required: false
# Cooldowns in seconds
cooldowns:
  imperial_reprisal: 30
  imperial_decree: 30
  royal_slam: 60
  royal_dash: 20
  time_warp: 300
  ageing_strike: 30
  health_drain: 60
  life_giver: 30
  void_slash: 30
  dragons_domain: 120
  abyssal_cleave: 30
  void_power: 90
  execution: 30
  judgements_mark: 60
  inspire: 60
  sacrifice: 90
  lucky_draw: 45
  double_or_nothing: 60
  bloodbath: 45
  blinding_eclipse: 60
  lightning_storm: 30
  tides_call: 40
  call_of_the_deep: 120
  stunning_strike: 30
  durability_drain: 60
  void_walk: 15
  pull_of_the_void: 30
  acidic_blaze: 45
  incineration: 120
  sculk_beams: 60
  summon_warden: 300
  royal_judgement: 60
  temporal_cleave: 90
  temporal_dismemberment: 120
  live_for_the_hunt: 600
  smite: 30
  final_verdict: 30
  void_throw: 20
  piercing_strike: 20   # not specified by you, change freely
# Incineration: radius of the affected area (the "40 block area" = 40 wide, so radius 20)
incineration-radius: 20
# Dome radius for Call of the Deep
dome-radius: 10
# Skulk Battle Axe
sculk-beam-armor-durability: 50   # durability removed from a random armor piece per beam
warden-lifetime-seconds: 60       # summoned warden despawns after this long
# Temporal Reaver
temporal-cleave:
  radius: 25
  duration-seconds: 5
temporal-dismemberment:
  range: 25
  clone-damage-hearts: 1.5
  erasure-damage-hearts: 3.0
  mark-seconds: 10
  mark-bonus: 0.25      # +25% damage from the holder against a Marked target
# Primal Bow
hunters-momentum-max: 30
# Show ability cooldowns above the hotbar while holding a weapon
cooldown-hud: true
# New items
priest-sacrifice-radius: 15      # enemies this close have their armor damaged by the Priest's Staff sacrifice
health-drain-max-gain: 20.0      # most health (in half hearts) the Soul Reaper can gain from one drain
rift-lifetime-seconds: 30        # how long Dragon's Rend rifts stay around
domain-breath-damage: 1.0        # damage per half second to enemies standing in Dragon's Domain

# ---------------------------------------------------------------- Primal Blade
primal-blade:
  max-kills: 10                 # the blade stops counting here
  reset-on-death: true          # kills (and the perks they unlock) reset when you die
  count-mobs: false             # false = only player kills count
  base-chains: 1                # grapple chains you always have
  bonus-chains: 2               # extra chains unlocked at bonus-chains-kills
  bonus-chains-kills: 3
  chain-regen-seconds: 10       # each chain comes back after this long
  chain-delay-seconds: 0.5      # time between two chain shots (no spam)
  grapple-range: 40
  grapple-damage-hearts: 2
  strength-kills: 5             # kills for permanent Strength (level: passive-effects.primal_blade.strength)
  speed-kills: 7                # kills for permanent Speed   (level: passive-effects.primal_blade.speed)
  glow-kills: 9                 # kills for Glowing on untrusted players nearby
  glow-radius: 50
  pack-kills: 10                # kills needed for Hunter's Pack
  wolf-count: 50
  wolf-lifetime-seconds: 120
  wolf-strength-level: 2
  wolf-speed-level: 2
  pack-cooldown-seconds: 30     # starts when the pack despawns

# ---------------------------------------------------------------- Enchantment levels (any item)
# enchants.<item_id>.<enchantment>: level      (0 removes the enchantment). Applies to newly given items.
# Item ids: bloody_eclipse, stormcaller, dwarven_pickaxe, ten_ton_axe, void_blade, inferno, sculk_battle_axe, royal_spear, kings_crown,
#           divine_judgement, hammer_of_the_void, temporal_reaver, primal_bow, mad_scientists_crossbow, kings_shield, kings_plate,
#           kings_legguards, kings_step, chrono_blade, soul_reaper, dragons_rend, axe_of_abyss, divine_executioner, priests_staff,
#           gamblers_sword, primal_blade
enchants:
  primal_blade:
    sharpness: 5
    unbreaking: 3
    mending: 1
    fire_aspect: 2
  # example: make the Void Blade sharper
  # void_blade:
  #   sharpness: 7

# ---------------------------------------------------------------- Passive potion effect levels (any item)
# passive-effects.<item_id>.<effect>: level      (0 turns the effect off; effect = vanilla name like strength, speed, fire_resistance)
passive-effects:
  primal_blade:
    strength: 2
    speed: 2
  # example: Speed IV on the Void Blade
  # void_blade:
  #   speed: 4
